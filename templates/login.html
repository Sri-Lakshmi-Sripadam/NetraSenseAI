<!DOCTYPE html>
<html>
<head>
  <title>Login - NetraSenseAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>👁️ NetraSenseAI</h1>
    <p style="text-align:center;color:#7a8da8;font-size:13px;margin:6px 0 24px;">AI-POWERED EYE SCREENING PLATFORM</p>
    <h2 style="text-align:center;color:#0f2c4d;">Welcome Back</h2>
    <p style="text-align:center;color:#7a8da8;font-size:13px;margin:6px 0 24px;">Login to access dashboard</p>
    
    <form action="/login" method="POST">
      <input type="email" name="email" placeholder="📧 Email address" required>
      <input type="password" name="password" placeholder="🔒 Password" required>
      <button type="submit">Login to Dashboard →</button>
    </form>
    <p style="text-align:center;margin-top:18px;font-size:13px;">New? <a href="/register" style="color:#1e88e5;font-weight:700;text-decoration:none;">Create Account</a></p>
  </div>
</div>
</body>
</html>
